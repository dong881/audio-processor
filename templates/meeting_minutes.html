<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會議紀錄模板生成器 - Audio Processor</title>
    <!-- Favicon -->
    <link rel="icon" href="/static/img/webUI.png" type="image/png">
    <link rel="apple-touch-icon" href="/static/img/webUI.png">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- 自定義樣式 -->
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- 引入 SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <!-- 頁面頂部導航欄 -->
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-soundwave me-2" style="font-size: 1.8rem;"></i>
                <span>Audio Processor</span>
            </a>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="/">
                        <i class="bi bi-house me-2"></i> 首頁
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/meeting-minutes">
                        <i class="bi bi-file-text me-2"></i> 會議紀錄模板
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- 頁面主要內容 -->
    <div class="container mt-4">
        <!-- 頂部標題部分 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body text-center">
                        <h1 class="mb-2">
                            <i class="bi bi-file-text me-2"></i>
                            會議紀錄模板生成器
                        </h1>
                        <p class="lead" style="font-size: 1.25rem;">
                            快速生成標準化的會議紀錄模板，供LLM使用
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- 左側：模板配置區域 -->
            <div class="col-lg-6">
                <div class="card mb-4">
                    <div class="app-card-header">
                        <i class="bi bi-gear me-2"></i>
                        模板配置
                    </div>
                    <div class="card-body">
                        <form id="template-form">
                            <!-- 基本資訊 -->
                            <div class="mb-4">
                                <h6 class="fw-bold mb-3">
                                    <i class="bi bi-info-circle me-2"></i>基本資訊
                                </h6>
                                
                                <div class="mb-3">
                                    <label for="meeting-title" class="form-label">會議標題</label>
                                    <input type="text" class="form-control" id="meeting-title" 
                                           placeholder="請輸入會議標題" value="[Meeting Title]">
                                </div>
                                
                                <div class="row">
                                    <div class="col-md-6">
                                        <label for="meeting-date" class="form-label">會議日期</label>
                                        <input type="date" class="form-control" id="meeting-date">
                                    </div>
                                    <div class="col-md-3">
                                        <label for="start-time" class="form-label">開始時間</label>
                                        <input type="time" class="form-control" id="start-time" value="09:00">
                                    </div>
                                    <div class="col-md-3">
                                        <label for="end-time" class="form-label">結束時間</label>
                                        <input type="time" class="form-control" id="end-time" value="10:00">
                                    </div>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="meeting-status" class="form-label">會議狀態</label>
                                    <select class="form-select" id="meeting-status">
                                        <option value="Draft agenda">Draft agenda</option>
                                        <option value="Complete">Complete</option>
                                    </select>
                                </div>
                            </div>

                            <!-- 模板類型 -->
                            <div class="mb-4">
                                <h6 class="fw-bold mb-3">
                                    <i class="bi bi-collection me-2"></i>模板類型
                                </h6>
                                <div class="btn-group w-100" role="group">
                                    <input type="radio" class="btn-check" name="template-variant" id="variant-standard" value="standard" checked>
                                    <label class="btn btn-outline-primary" for="variant-standard">標準</label>
                                    
                                    <input type="radio" class="btn-check" name="template-variant" id="variant-standup" value="standup">
                                    <label class="btn btn-outline-primary" for="variant-standup">站會</label>
                                    
                                    <input type="radio" class="btn-check" name="template-variant" id="variant-retrospective" value="retrospective">
                                    <label class="btn btn-outline-primary" for="variant-retrospective">回顧</label>
                                    
                                    <input type="radio" class="btn-check" name="template-variant" id="variant-planning" value="planning">
                                    <label class="btn btn-outline-primary" for="variant-planning">規劃</label>
                                    
                                    <input type="radio" class="btn-check" name="template-variant" id="variant-review" value="review">
                                    <label class="btn btn-outline-primary" for="variant-review">審查</label>
                                </div>
                            </div>

                            <!-- 參與者 -->
                            <div class="mb-4">
                                <h6 class="fw-bold mb-3">
                                    <i class="bi bi-people me-2"></i>參與者
                                </h6>
                                <div id="attendees-container">
                                    <div class="attendee-item mb-2">
                                        <div class="row">
                                            <div class="col-md-6">
                                                <input type="text" class="form-control" placeholder="姓名" value="[Name 1]">
                                            </div>
                                            <div class="col-md-5">
                                                <input type="text" class="form-control" placeholder="角色" value="[Role]">
                                            </div>
                                            <div class="col-md-1">
                                                <button type="button" class="btn btn-outline-danger btn-sm" onclick="removeAttendee(this)">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="attendee-item mb-2">
                                        <div class="row">
                                            <div class="col-md-6">
                                                <input type="text" class="form-control" placeholder="姓名" value="[Name 2]">
                                            </div>
                                            <div class="col-md-5">
                                                <input type="text" class="form-control" placeholder="角色" value="[Role]">
                                            </div>
                                            <div class="col-md-1">
                                                <button type="button" class="btn btn-outline-danger btn-sm" onclick="removeAttendee(this)">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="attendee-item mb-2">
                                        <div class="row">
                                            <div class="col-md-6">
                                                <input type="text" class="form-control" placeholder="姓名" value="[Name 3]">
                                            </div>
                                            <div class="col-md-5">
                                                <input type="text" class="form-control" placeholder="角色" value="[Role]">
                                            </div>
                                            <div class="col-md-1">
                                                <button type="button" class="btn btn-outline-danger btn-sm" onclick="removeAttendee(this)">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <button type="button" class="btn btn-outline-primary btn-sm" onclick="addAttendee()">
                                    <i class="bi bi-plus-circle me-1"></i>新增參與者
                                </button>
                            </div>

                            <!-- 議程項目 -->
                            <div class="mb-4">
                                <h6 class="fw-bold mb-3">
                                    <i class="bi bi-list-ol me-2"></i>議程項目
                                </h6>
                                <div id="agenda-container">
                                    <div class="agenda-item mb-2">
                                        <div class="input-group">
                                            <span class="input-group-text">1.</span>
                                            <input type="text" class="form-control" placeholder="議程項目" value="[Agenda item 1]">
                                            <button type="button" class="btn btn-outline-danger" onclick="removeAgendaItem(this)">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="agenda-item mb-2">
                                        <div class="input-group">
                                            <span class="input-group-text">2.</span>
                                            <input type="text" class="form-control" placeholder="議程項目" value="[Agenda item 2]">
                                            <button type="button" class="btn btn-outline-danger" onclick="removeAgendaItem(this)">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="agenda-item mb-2">
                                        <div class="input-group">
                                            <span class="input-group-text">3.</span>
                                            <input type="text" class="form-control" placeholder="議程項目" value="[Agenda item 3]">
                                            <button type="button" class="btn btn-outline-danger" onclick="removeAgendaItem(this)">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <button type="button" class="btn btn-outline-primary btn-sm" onclick="addAgendaItem()">
                                    <i class="bi bi-plus-circle me-1"></i>新增議程項目
                                </button>
                            </div>

                            <!-- 自定義備註 -->
                            <div class="mb-4">
                                <h6 class="fw-bold mb-3">
                                    <i class="bi bi-sticky me-2"></i>自定義備註
                                </h6>
                                <textarea class="form-control" id="custom-notes" rows="3" 
                                          placeholder="Additional context, links, or references."></textarea>
                            </div>

                            <!-- 生成按鈕 -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-success btn-lg">
                                    <i class="bi bi-magic me-2"></i>生成會議紀錄模板
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- 右側：模板預覽區域 -->
            <div class="col-lg-6">
                <div class="card mb-4">
                    <div class="app-card-header">
                        <div class="d-flex justify-content-between align-items-center w-100">
                            <span><i class="bi bi-eye me-2"></i>模板預覽</span>
                            <div class="header-controls">
                                <button class="btn btn-sm btn-outline-primary" id="copy-template-btn" title="複製模板">
                                    <i class="bi bi-clipboard me-1"></i>複製
                                </button>
                                <button class="btn btn-sm btn-outline-secondary" id="download-template-btn" title="下載模板">
                                    <i class="bi bi-download me-1"></i>下載
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="template-preview" class="template-preview">
                            <div class="text-center text-muted py-5">
                                <i class="bi bi-file-text" style="font-size: 3rem;"></i>
                                <p class="mt-3">點擊「生成會議紀錄模板」按鈕來預覽模板</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 頁腳 -->
    <footer class="container mt-5">
        <div class="row">
            <div class="col-12 text-center">
                <hr>
                <p class="text-muted">
                    2025 Audio Processor - 會議紀錄模板生成器
                </p>
            </div>
        </div>
    </footer>

    <!-- 引入 Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- 會議紀錄模板生成器 JS -->
    <script>
        // 設置今天的日期
        document.getElementById('meeting-date').value = new Date().toISOString().split('T')[0];

        // 表單提交處理
        document.getElementById('template-form').addEventListener('submit', function(e) {
            e.preventDefault();
            generateTemplate();
        });

        // 生成模板
        function generateTemplate() {
            const formData = {
                meeting_title: document.getElementById('meeting-title').value,
                date: document.getElementById('meeting-date').value,
                start_time: document.getElementById('start-time').value,
                end_time: document.getElementById('end-time').value,
                status: document.getElementById('meeting-status').value,
                custom_notes: document.getElementById('custom-notes').value,
                variant: document.querySelector('input[name="template-variant"]:checked').value,
                attendees: getAttendees(),
                agenda_items: getAgendaItems()
            };

            fetch('/api/meeting-minutes/template', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    displayTemplate(data.template);
                } else {
                    Swal.fire('錯誤', data.error || '生成模板時發生錯誤', 'error');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                Swal.fire('錯誤', '生成模板時發生錯誤', 'error');
            });
        }

        // 獲取參與者數據
        function getAttendees() {
            const attendees = [];
            const attendeeItems = document.querySelectorAll('.attendee-item');
            
            attendeeItems.forEach(item => {
                const inputs = item.querySelectorAll('input');
                if (inputs.length >= 2 && inputs[0].value.trim() && inputs[1].value.trim()) {
                    attendees.push({
                        name: inputs[0].value.trim(),
                        role: inputs[1].value.trim()
                    });
                }
            });
            
            return attendees.length > 0 ? attendees : null;
        }

        // 獲取議程項目數據
        function getAgendaItems() {
            const agendaItems = [];
            const agendaItemsElements = document.querySelectorAll('.agenda-item input');
            
            agendaItemsElements.forEach(input => {
                if (input.value.trim()) {
                    agendaItems.push(input.value.trim());
                }
            });
            
            return agendaItems.length > 0 ? agendaItems : null;
        }

        // 顯示模板
        function displayTemplate(template) {
            const preview = document.getElementById('template-preview');
            preview.innerHTML = `<pre class="template-content">${template}</pre>`;
        }

        // 複製模板
        document.getElementById('copy-template-btn').addEventListener('click', function() {
            const templateContent = document.querySelector('.template-content');
            if (templateContent) {
                navigator.clipboard.writeText(templateContent.textContent).then(() => {
                    Swal.fire('成功', '模板已複製到剪貼板', 'success');
                });
            } else {
                Swal.fire('提示', '請先生成模板', 'info');
            }
        });

        // 下載模板
        document.getElementById('download-template-btn').addEventListener('click', function() {
            const templateContent = document.querySelector('.template-content');
            if (templateContent) {
                const blob = new Blob([templateContent.textContent], { type: 'text/markdown' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'meeting-minutes-template.md';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
                Swal.fire('成功', '模板已下載', 'success');
            } else {
                Swal.fire('提示', '請先生成模板', 'info');
            }
        });

        // 新增參與者
        function addAttendee() {
            const container = document.getElementById('attendees-container');
            const attendeeCount = container.children.length + 1;
            
            const attendeeItem = document.createElement('div');
            attendeeItem.className = 'attendee-item mb-2';
            attendeeItem.innerHTML = `
                <div class="row">
                    <div class="col-md-6">
                        <input type="text" class="form-control" placeholder="姓名" value="[Name ${attendeeCount}]">
                    </div>
                    <div class="col-md-5">
                        <input type="text" class="form-control" placeholder="角色" value="[Role]">
                    </div>
                    <div class="col-md-1">
                        <button type="button" class="btn btn-outline-danger btn-sm" onclick="removeAttendee(this)">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </div>
            `;
            
            container.appendChild(attendeeItem);
        }

        // 移除參與者
        function removeAttendee(button) {
            const attendeeItem = button.closest('.attendee-item');
            if (document.querySelectorAll('.attendee-item').length > 1) {
                attendeeItem.remove();
            } else {
                Swal.fire('提示', '至少需要保留一個參與者', 'info');
            }
        }

        // 新增議程項目
        function addAgendaItem() {
            const container = document.getElementById('agenda-container');
            const agendaCount = container.children.length + 1;
            
            const agendaItem = document.createElement('div');
            agendaItem.className = 'agenda-item mb-2';
            agendaItem.innerHTML = `
                <div class="input-group">
                    <span class="input-group-text">${agendaCount}.</span>
                    <input type="text" class="form-control" placeholder="議程項目" value="[Agenda item ${agendaCount}]">
                    <button type="button" class="btn btn-outline-danger" onclick="removeAgendaItem(this)">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
            `;
            
            container.appendChild(agendaItem);
        }

        // 移除議程項目
        function removeAgendaItem(button) {
            const agendaItem = button.closest('.agenda-item');
            if (document.querySelectorAll('.agenda-item').length > 1) {
                agendaItem.remove();
                // 重新編號
                renumberAgendaItems();
            } else {
                Swal.fire('提示', '至少需要保留一個議程項目', 'info');
            }
        }

        // 重新編號議程項目
        function renumberAgendaItems() {
            const agendaItems = document.querySelectorAll('.agenda-item');
            agendaItems.forEach((item, index) => {
                const numberSpan = item.querySelector('.input-group-text');
                numberSpan.textContent = `${index + 1}.`;
            });
        }
    </script>

    <style>
        .template-preview {
            max-height: 600px;
            overflow-y: auto;
        }
        
        .template-content {
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.4;
            margin: 0;
            padding: 1rem;
            background-color: #f8f9fa;
            border-radius: 0.375rem;
            border: 1px solid #dee2e6;
        }
        
        .attendee-item, .agenda-item {
            transition: all 0.2s ease;
        }
        
        .attendee-item:hover, .agenda-item:hover {
            background-color: #f8f9fa;
            border-radius: 0.375rem;
            padding: 0.5rem;
            margin: 0.5rem -0.5rem;
        }
    </style>
</body>
</html>
